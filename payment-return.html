<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | Trends Media Consult</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><script src="api-config.js"></script></head><body><main class="article-main"><p class="eyebrow">Trends Media Consult</p><h1 id="payment-title">Checking your payment…</h1><p id="payment-message" aria-live="polite">We’re confirming the transaction securely with Paystack.</p><a class="article-back" href="/">Return to the website</a></main><script>
(async()=>{const q=new URLSearchParams(location.search),ref=q.get('reference')||q.get('trxref');const title=document.querySelector('#payment-title'),message=document.querySelector('#payment-message');if(!ref){title.textContent='Payment not completed';message.textContent='No completed payment reference was returned. If you cancelled checkout, no payment was taken.';return}try{const base=(window.CMC_API_BASE_URL||'').replace(/\/$/,'');const r=await fetch(`${base}/api/payment/verify/${encodeURIComponent(ref)}`);const data=await r.json();if(r.ok&&data.ok){title.textContent='Payment confirmed';message.textContent='Your payment was verified successfully. Thank you.'}else{title.textContent='Payment not confirmed';message.textContent='The payment has not been verified as successful. If you completed checkout, please contact us with your payment reference.'}}catch{title.textContent='Unable to confirm payment';message.textContent='Please contact us with your Paystack reference so we can check the transaction.'}})();
</script></body></html>
